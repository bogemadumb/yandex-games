<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cherry to Galaxy</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4f9bff">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="i-coin" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#ffb300" stroke="#c77700" stroke-width="2"/><circle cx="16" cy="16" r="10" fill="#ffd54a" stroke="#e69500" stroke-width="1.5"/><path d="M16 9l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5-3.6-3.5 5-.7z" fill="#fff3b0" stroke="#e69500" stroke-width=".8" stroke-linejoin="round"/></symbol>
<symbol id="i-gift" viewBox="0 0 32 32"><rect x="4" y="12" width="24" height="16" rx="3" fill="#ff5c8a" stroke="#b32355" stroke-width="2"/><rect x="2.5" y="8" width="27" height="6" rx="2.5" fill="#ff8fb3" stroke="#b32355" stroke-width="2"/><rect x="14" y="8" width="4" height="20" fill="#ffe27a"/><path d="M16 8c-3-6-9-4-7 0zM16 8c3-6 9-4 7 0z" fill="#ffe27a" stroke="#c78a00" stroke-width="1.6" stroke-linejoin="round"/></symbol>
<symbol id="i-snd" viewBox="0 0 32 32"><path d="M5 12h5l7-6v20l-7-6H5z" fill="#fff"/><path d="M21 11c2.6 2.6 2.6 7.4 0 10M24.5 7.5c4.6 4.6 4.6 12.4 0 17" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></symbol>
<symbol id="i-mute" viewBox="0 0 32 32"><path d="M5 12h5l7-6v20l-7-6H5z" fill="#fff"/><path d="M21 12l8 8M29 12l-8 8" stroke="#ffd0d8" stroke-width="3" stroke-linecap="round"/></symbol>
<symbol id="i-play" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#fff" fill-opacity=".95"/><path d="M13 9.5l10 6.5-10 6.5z" fill="#f5487f" stroke="#f5487f" stroke-width="2" stroke-linejoin="round"/></symbol>
<symbol id="i-up" viewBox="0 0 32 32"><path d="M16 3l11 12h-7v13H12V15H5z" fill="#fff" stroke="#1c8a41" stroke-width="2" stroke-linejoin="round"/></symbol>
<symbol id="i-bolt" viewBox="0 0 32 32"><path d="M19 2L6 18h8l-2 12 14-18h-8z" fill="#ffd34d" stroke="#c76a00" stroke-width="2" stroke-linejoin="round"/></symbol>
<symbol id="i-merge" viewBox="0 0 32 32"><circle cx="11" cy="16" r="8" fill="#ff7a7a" stroke="#a1002a" stroke-width="2"/><circle cx="21" cy="16" r="8" fill="#7ad0ff" stroke="#16418f" stroke-width="2" fill-opacity=".92"/><path d="M16 11v10M11 16h10" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></symbol>
<symbol id="i-moon" viewBox="0 0 32 32"><path d="M22 3a13 13 0 1 0 7 20A11 11 0 0 1 22 3z" fill="#ffe27a" stroke="#c78a00" stroke-width="2" stroke-linejoin="round"/><circle cx="23" cy="10" r="1.3" fill="#fff"/><circle cx="27" cy="15" r="1" fill="#fff"/></symbol>
<symbol id="i-inc" viewBox="0 0 32 32"><circle cx="14" cy="18" r="11" fill="#ffd54a" stroke="#e69500" stroke-width="2"/><path d="M24 3v10M19 8h10" stroke="#3ddc84" stroke-width="3.4" stroke-linecap="round"/></symbol>
<symbol id="i-x" viewBox="0 0 32 32"><path d="M8 8l16 16M24 8L8 24" stroke="#fff" stroke-width="4" stroke-linecap="round"/></symbol>
</defs>
</svg>

<canvas id="c"></canvas>

<div id="hud"><div id="hudin">
  <div class="col">
    <div class="pill" id="coinpill"><svg class="ico"><use href="#i-coin"/></svg><span id="coins">0</span></div>
    <div id="cps">+0/s</div>
  </div>
  <div class="sp"></div>
  <button class="rbtn" id="bgift" aria-label="daily"><svg class="ico"><use href="#i-gift"/></svg><i class="dot"></i></button>
  <button class="rbtn" id="bsnd" aria-label="sound"><svg class="ico"><use href="#i-snd"/></svg></button>
</div></div>

<div id="bar">
  <button class="btn green" id="bshop"><svg class="ico"><use href="#i-up"/></svg><span id="tshop"></span><i class="dot"></i></button>
  <button class="btn orange" id="bspawn"><span class="big" id="tspawn"></span><span class="pips" id="pips"></span></button>
  <button class="btn pink" id="bboost"><svg class="ico"><use href="#i-play"/></svg><span id="tboost"></span><small id="tboost2"></small></button>
</div>

<div id="hint"></div>
<div id="toast"></div>
<div id="banner"></div>
<div id="modal" class="hidden"><div class="card" id="card"></div></div>
<div id="adov" class="hidden"><div class="adbox" id="adtxt"></div></div>

<!--sdk--><script src="/sdk.js"></script>
<script src="sdk-mock.js"></script><!--/sdk-->
<script src="platform.js"></script>
<script src="sprites.js"></script>
<script src="game.js"></script>
</body>
</html>
