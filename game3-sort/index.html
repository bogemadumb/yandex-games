<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ball Sort</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e9f4ff">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="i-snd" viewBox="0 0 32 32"><path d="M5 12h5l7-6v20l-7-6H5z" fill="#2b4fb8"/><path d="M21 11c2.6 2.6 2.6 7.4 0 10M24.5 7.5c4.6 4.6 4.6 12.4 0 17" fill="none" stroke="#2b4fb8" stroke-width="2.6" stroke-linecap="round"/></symbol>
<symbol id="i-mute" viewBox="0 0 32 32"><path d="M5 12h5l7-6v20l-7-6H5z" fill="#2b4fb8"/><path d="M21 12l8 8M29 12l-8 8" stroke="#f5487f" stroke-width="3" stroke-linecap="round"/></symbol>
<symbol id="i-menu" viewBox="0 0 32 32"><rect x="5" y="7" width="22" height="4" rx="2" fill="#2b4fb8"/><rect x="5" y="14" width="22" height="4" rx="2" fill="#2b4fb8"/><rect x="5" y="21" width="22" height="4" rx="2" fill="#2b4fb8"/></symbol>
<symbol id="i-pat" viewBox="0 0 32 32"><circle cx="9" cy="9" r="5" fill="#ff4d5e" stroke="#2b4fb8" stroke-width="1.6"/><rect x="17" y="4" width="11" height="11" rx="2.5" fill="#ffd93d" stroke="#2b4fb8" stroke-width="1.6"/><path d="M9 18l6 10H3z" fill="#3d8bff" stroke="#2b4fb8" stroke-width="1.6" stroke-linejoin="round"/><path d="M22.5 17.5l2.2 4.5 5 .7-3.6 3.5.9 4.9-4.5-2.4-4.5 2.4.9-4.9-3.6-3.5 5-.7z" fill="#3ed17a" stroke="#2b4fb8" stroke-width="1.4" stroke-linejoin="round"/></symbol>
<symbol id="i-play" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#fff" fill-opacity=".95"/><path d="M13 9.5l10 6.5-10 6.5z" fill="#f5487f" stroke="#f5487f" stroke-width="2" stroke-linejoin="round"/></symbol>
<symbol id="i-x" viewBox="0 0 32 32"><path d="M8 8l16 16M24 8L8 24" stroke="#fff" stroke-width="4" stroke-linecap="round"/></symbol>
<symbol id="i-lock" viewBox="0 0 32 32"><rect x="6" y="14" width="20" height="14" rx="3.5" fill="#aab6d3" stroke="#7f8db3" stroke-width="2"/><path d="M10.5 14v-3.5a5.5 5.5 0 0 1 11 0V14" fill="none" stroke="#7f8db3" stroke-width="3"/></symbol>
<symbol id="i-star" viewBox="0 0 32 32"><path d="M16 2l4.2 8.8 9.8 1.3-7.1 6.8 1.8 9.6L16 23.6 7.3 28.5l1.8-9.6L2 12.1l9.8-1.3z" fill="#ffd54a" stroke="#c77700" stroke-width="2" stroke-linejoin="round"/></symbol>
<symbol id="i-star0" viewBox="0 0 32 32"><path d="M16 2l4.2 8.8 9.8 1.3-7.1 6.8 1.8 9.6L16 23.6 7.3 28.5l1.8-9.6L2 12.1l9.8-1.3z" fill="#d5def2" stroke="#aab6d3" stroke-width="2" stroke-linejoin="round"/></symbol>
<symbol id="i-undo" viewBox="0 0 32 32"><path d="M13 5L6 12l7 7" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 12h12a7 7 0 0 1 0 14h-6" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/></symbol>
<symbol id="i-restart" viewBox="0 0 32 32"><path d="M26 16a10 10 0 1 1-3.2-7.3" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/><path d="M24.5 3v7.5H17z" fill="#fff"/></symbol>
<symbol id="i-tube" viewBox="0 0 32 32"><path d="M9 4h9v17a4.5 4.5 0 0 1-9 0z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><path d="M25 14v10M20 19h10" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></symbol>
<symbol id="i-grid" viewBox="0 0 32 32"><rect x="4" y="4" width="10" height="10" rx="3" fill="#fff"/><rect x="18" y="4" width="10" height="10" rx="3" fill="#fff"/><rect x="4" y="18" width="10" height="10" rx="3" fill="#fff"/><rect x="18" y="18" width="10" height="10" rx="3" fill="#fff"/></symbol>
<symbol id="i-vid" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#f5487f"/><path d="M12.5 9l11 7-11 7z" fill="#fff"/></symbol>
<symbol id="i-flame" viewBox="0 0 32 32"><path d="M16 2c1 6 8 9 8 17a8 8 0 0 1-16 0c0-4 2-6 3-8 1 2 2 3 3 3 0-4-1-8 2-12z" fill="#ff7a2e" stroke="#c0390a" stroke-width="1.6" stroke-linejoin="round"/></symbol>
</defs>
</svg>

<canvas id="c"></canvas>

<div id="hud"><div id="hudin">
  <button class="rbtn" id="bmenu" aria-label="menu"><svg class="ico"><use href="#i-menu"/></svg></button>
  <div class="lvbox"><b id="lvl"></b><small id="mv"></small></div>
  <div class="sp"></div>
  <button class="rbtn" id="bpat" aria-label="patterns"><svg class="ico"><use href="#i-pat"/></svg></button>
  <button class="rbtn" id="bsnd" aria-label="sound"><svg class="ico"><use href="#i-snd"/></svg></button>
</div></div>

<div id="bar"><div id="barin">
  <button class="abtn blue" id="bmap" aria-label="levels"><svg class="ico"><use href="#i-grid"/></svg><span id="lmap"></span></button>
  <button class="abtn orange" id="bundo" aria-label="undo"><svg class="ico"><use href="#i-undo"/></svg><span id="lundo"></span><i class="bdg" id="gundo"></i></button>
  <button class="abtn pink" id="brestart" aria-label="restart"><svg class="ico"><use href="#i-restart"/></svg><span id="lrestart"></span></button>
  <button class="abtn green" id="btube" aria-label="tube"><svg class="ico"><use href="#i-tube"/></svg><span id="ltube"></span><i class="bdg" id="gtube"></i></button>
</div></div>

<div id="hint"></div>
<div id="toast"></div>
<div id="modal" class="hidden"><div class="card" id="card"></div></div>
<div id="adov" class="hidden"><div class="adbox" id="adtxt"></div></div>

<!--sdk--><script src="/sdk.js"></script>
<script src="sdk-mock.js"></script><!--/sdk-->
<script src="platform.js"></script>
<script src="gen.js"></script>
<script src="pars.js"></script>
<script src="game.js"></script>
</body>
</html>
