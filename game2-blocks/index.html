<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Block Blitz</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e9f4ff">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="i-crown" viewBox="0 0 32 32"><path d="M4 24l-1-14 7 6 6-10 6 10 7-6-1 14z" fill="#ffb300" stroke="#c77700" stroke-width="2" stroke-linejoin="round"/><rect x="4" y="24" width="24" height="4" rx="1.5" fill="#ffd54a" stroke="#c77700" stroke-width="2"/></symbol>
<symbol id="i-snd" viewBox="0 0 32 32"><path d="M5 12h5l7-6v20l-7-6H5z" fill="#2b4fb8"/><path d="M21 11c2.6 2.6 2.6 7.4 0 10M24.5 7.5c4.6 4.6 4.6 12.4 0 17" fill="none" stroke="#2b4fb8" stroke-width="2.6" stroke-linecap="round"/></symbol>
<symbol id="i-mute" viewBox="0 0 32 32"><path d="M5 12h5l7-6v20l-7-6H5z" fill="#2b4fb8"/><path d="M21 12l8 8M29 12l-8 8" stroke="#f5487f" stroke-width="3" stroke-linecap="round"/></symbol>
<symbol id="i-menu" viewBox="0 0 32 32"><rect x="5" y="7" width="22" height="4" rx="2" fill="#2b4fb8"/><rect x="5" y="14" width="22" height="4" rx="2" fill="#2b4fb8"/><rect x="5" y="21" width="22" height="4" rx="2" fill="#2b4fb8"/></symbol>
<symbol id="i-play" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#fff" fill-opacity=".95"/><path d="M13 9.5l10 6.5-10 6.5z" fill="#f5487f" stroke="#f5487f" stroke-width="2" stroke-linejoin="round"/></symbol>
<symbol id="i-x" viewBox="0 0 32 32"><path d="M8 8l16 16M24 8L8 24" stroke="#fff" stroke-width="4" stroke-linecap="round"/></symbol>
<symbol id="i-medal" viewBox="0 0 32 32"><path d="M9 2l5 10h4l5-10z" fill="#ff5c8a" stroke="#a81f50" stroke-width="1.6" stroke-linejoin="round"/><circle cx="16" cy="20" r="9" fill="#ffd54a" stroke="#c77700" stroke-width="2"/><path d="M16 14l2 4 4.4.6-3.2 3 .8 4.4-4-2.1-4 2.1.8-4.4-3.2-3 4.4-.6z" fill="#fff3b0" stroke="#e69500" stroke-width=".9" stroke-linejoin="round"/></symbol>
<symbol id="i-lock" viewBox="0 0 32 32"><rect x="6" y="14" width="20" height="14" rx="3.5" fill="#aab6d3" stroke="#7f8db3" stroke-width="2"/><path d="M10.5 14v-3.5a5.5 5.5 0 0 1 11 0V14" fill="none" stroke="#7f8db3" stroke-width="3"/></symbol>
<symbol id="i-cal" viewBox="0 0 32 32"><rect x="4" y="6" width="24" height="22" rx="4" fill="#fff" stroke="#2b4fb8" stroke-width="2.2"/><rect x="4" y="6" width="24" height="8" rx="4" fill="#3d8bff" stroke="#2b4fb8" stroke-width="2.2"/><path d="M10 3v6M22 3v6" stroke="#2b4fb8" stroke-width="3" stroke-linecap="round"/><path d="M16 16l1.9 3.9 4.3.6-3.1 3 .7 4.2-3.8-2-3.8 2 .7-4.2-3.1-3 4.3-.6z" fill="#ffb300" stroke="#c77700" stroke-width=".9" stroke-linejoin="round"/></symbol>
<symbol id="i-trophy" viewBox="0 0 32 32"><path d="M9 4h14v9a7 7 0 0 1-14 0z" fill="#ffd54a" stroke="#c77700" stroke-width="2" stroke-linejoin="round"/><path d="M9 7H4c0 5 2 8 5.5 8.5M23 7h5c0 5-2 8-5.5 8.5" fill="none" stroke="#c77700" stroke-width="2" stroke-linecap="round"/><rect x="13.5" y="20" width="5" height="5" fill="#e69500"/><rect x="9" y="25" width="14" height="4" rx="2" fill="#ffb300" stroke="#c77700" stroke-width="2"/></symbol>
<symbol id="i-star" viewBox="0 0 32 32"><path d="M16 2l4.2 8.8 9.8 1.3-7.1 6.8 1.8 9.6L16 23.6 7.3 28.5l1.8-9.6L2 12.1l9.8-1.3z" fill="#ffd54a" stroke="#c77700" stroke-width="2" stroke-linejoin="round"/></symbol>
<symbol id="i-refresh" viewBox="0 0 32 32"><path d="M26 16a10 10 0 1 1-3.2-7.3" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/><path d="M24.5 3v7.5H17z" fill="#fff"/></symbol>
</defs>
</svg>

<canvas id="c"></canvas>

<div id="hud"><div id="hudin">
  <div class="scorebox"><small id="tscore"></small><b id="score">0</b></div>
  <div id="combo"></div>
  <div class="sp"></div>
  <div class="pill" id="bestpill"><svg class="ico"><use href="#i-crown"/></svg><span id="best">0</span></div>
  <button class="rbtn" id="bsnd" aria-label="sound"><svg class="ico"><use href="#i-snd"/></svg></button>
  <button class="rbtn" id="bmenu" aria-label="menu"><svg class="ico"><use href="#i-menu"/></svg><i class="dot" id="dailydot"></i></button>
</div></div>

<div id="hint"></div>
<div id="toast"></div>
<div id="banner"></div>
<div id="modal" class="hidden"><div class="card" id="card"></div></div>
<div id="adov" class="hidden"><div class="adbox" id="adtxt"></div></div>

<!--sdk--><script src="/sdk.js"></script>
<script src="sdk-mock.js"></script><!--/sdk-->
<script src="platform.js"></script>
<script src="game.js"></script>
</body>
</html>
